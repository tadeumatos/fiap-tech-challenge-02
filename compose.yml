services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tech-challenge-02

    env_file:
      - .env

    ports:
      - "${SERVER_PORT}:8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - db-network

  postgres:
    container_name: postgresql-tech
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - db-network

volumes:
  postgres_data:

networks:
  db-network:
    name: db-network
    driver: bridge